[package]
name = "slimmanager"
version = "1.0.0"
description = "SlimManager – moderner Task-Manager für Gamer"
authors = ["SlimBit Apps"]
edition = "2021"

[lib]
name = "slimmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Klein und sparsam: Größe vor Geschwindigkeit, ohne Debug-Infos
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
