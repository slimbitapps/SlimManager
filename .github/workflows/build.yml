# Baut automatisch die Installer für Windows und Mac (Tauri-Version).
# Ergebnis: unter "Actions" -> letzter Lauf -> "Artifacts".
# Bei einem Versions-Tag (z. B. v1.0.0) oder Push auf main entsteht ein Release, von dem die
# Download-Seite immer die neueste Version verlinkt.
#
# Kostet nichts: GitHub Actions ist für öffentliche Projekte kostenlos. Ohne Zertifikate wird
# unsigniert gebaut (Windows zeigt dann "SmartScreen", macOS "nicht verifizierter Entwickler" – die
# Download-Seite erklärt, wie man trotzdem öffnet).
#
# Optional, falls später vorhanden (Settings -> Secrets -> Actions):
#   Mac: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
name: Installer bauen

on:
  push:
    branches: [main]
    tags: ['v*']
    # Nur Texte/Webseiten/Videos geändert → keine neuen Installer bauen
    paths-ignore: ['website/**', 'brand/**', 'docs/**', 'marketing/**', 'scripts/video/**', 'scripts/store-shots.cjs', '**/*.md', '.github/workflows/pages.yml', '.gitignore']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Kern-Programm bauen
        run: TRIPLE=x86_64-pc-windows-msvc bash scripts/build-core.sh
      - name: Rauchtest auf echtem Windows (Messwerte, Prozesse, Symbole, Einfrieren, Energieplan)
        run: node test/smoke.cjs src-tauri/binaries/slimmanager-core-x86_64-pc-windows-msvc.exe
      - name: Installer (Setup.exe)
        run: npx tauri build --bundles nsis
      - name: Dateien einsammeln + portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, portable/SlimManager | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/SlimManager-Setup.exe
          # Haupt-Programm (alles außer dem Kern) + Kern + Oberfläche
          $main = Get-ChildItem src-tauri/target/release/*.exe | Where-Object { $_.Name -notlike 'slimmanager-core*' } | Select-Object -First 1
          Copy-Item $main.FullName portable/SlimManager/SlimManager.exe
          Copy-Item src-tauri/binaries/slimmanager-core-x86_64-pc-windows-msvc.exe portable/SlimManager/slimmanager-core.exe
          Copy-Item -Recurse dist portable/SlimManager/web
          Compress-Archive -Path portable/SlimManager -DestinationPath out/SlimManager-Windows-portable.zip
          node test/smoke.cjs portable/SlimManager/slimmanager-core.exe
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: SlimManager-Windows
          path: out/*
          if-no-files-found: error

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, triple: aarch64-apple-darwin, file: SlimManager-Mac.dmg }
          - { runner: macos-15-intel, triple: x86_64-apple-darwin, file: SlimManager-Mac-Intel.dmg }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Kern-Programm bauen
        run: TRIPLE=${{ matrix.triple }} bash scripts/build-core.sh
      - name: Rauchtest
        run: node test/smoke.cjs src-tauri/binaries/slimmanager-core-${{ matrix.triple }}
      - name: App + DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx tauri build --bundles app,dmg
          # Kern so testen, wie er in der fertigen App liegt (neu signiert)
          node test/smoke.cjs src-tauri/target/release/bundle/macos/SlimManager.app/Contents/MacOS/slimmanager-core
          mkdir -p out
          cp src-tauri/target/release/bundle/dmg/*.dmg out/${{ matrix.file }}
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: SlimManager-${{ matrix.triple }}
          path: out/*.dmg
          if-no-files-found: error

  # Veröffentlicht die Dateien als Version "v<version aus package.json>".
  # Gleiche Version erneut hochgeladen -> Dateien werden ersetzt.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SlimManager ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows 10/11:** SlimManager-Setup.exe herunterladen und doppelklicken.
            **Mac (Apple-Chip M1–M4):** SlimManager-Mac.dmg öffnen und die App auf „Programme“ ziehen.
            **Älterer Mac mit Intel-Prozessor:** SlimManager-Mac-Intel.dmg
            **Ohne Installation (Windows):** SlimManager-Windows-portable.zip entpacken und SlimManager.exe starten.
            Anleitung mit Bildern: https://slimbitapps.github.io/SlimManager
          files: |
            out/SlimManager-Setup.exe
            out/SlimManager-Mac.dmg
            out/SlimManager-Mac-Intel.dmg
            out/SlimManager-Windows-portable.zip
