# Baut automatisch die Installer für Windows und Mac.
# Ergebnis: unter "Actions" -> letzter Lauf -> "Artifacts".
# Bei einem Versions-Tag (z. B. v1.0.0) oder Push auf main entsteht ein Release, von dem die
# Download-Seite immer die neueste Version verlinkt.
#
# Optionale Geheimnisse (Settings -> Secrets -> Actions), siehe VEROEFFENTLICHEN.md:
#   Mac:     MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD
# Ohne sie wird trotzdem gebaut, aber unsigniert (dann warnen Windows/macOS beim Öffnen).
name: Installer bauen

on:
  push:
    branches: [main]
    tags: ['v*']
    # Nur Texte/Webseiten/Videos geändert → keine neuen Installer bauen
    paths-ignore: ['website/**', 'brand/**', 'docs/**', 'marketing/**', 'scripts/video/**', 'scripts/store-shots.cjs', '**/*.md', '.github/workflows/pages.yml', '.gitignore']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Installer (Setup.exe) + portable ZIP
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SlimClick-Windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    env:
      HAS_APPLE: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Signiert + notarisiert (wenn Apple-Zugang hinterlegt)
        if: env.HAS_APPLE == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-builder --mac dmg --arm64 --x64 -c.mac.notarize=true --publish never
          mv release/SlimClick-Mac-arm64.dmg release/SlimClick-Mac.dmg
          mv release/SlimClick-Mac-x64.dmg release/SlimClick-Mac-Intel.dmg

      - name: Unsigniert (ohne Apple-Zugang)
        if: env.HAS_APPLE != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dir --arm64 --x64 -c.mac.identity=null --publish never
          codesign --force --deep --sign - release/mac-arm64/SlimClick.app
          codesign --force --deep --sign - release/mac/SlimClick.app
          npx electron-builder --mac dmg --arm64 -c.mac.identity=null --prepackaged release/mac-arm64/SlimClick.app --publish never
          npx electron-builder --mac dmg --x64 -c.mac.identity=null --prepackaged release/mac/SlimClick.app --publish never
          mv release/SlimClick-Mac-arm64.dmg release/SlimClick-Mac.dmg
          mv release/SlimClick-Mac-x64.dmg release/SlimClick-Mac-Intel.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SlimClick-Mac
          path: release/*.dmg
          if-no-files-found: error

  # Veröffentlicht die Dateien als Version "v<version aus package.json>".
  # Gleiche Version erneut hochgeladen -> Dateien werden ersetzt.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SlimClick ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** SlimClick-Setup.exe herunterladen und doppelklicken.
            **Mac (Apple-Chip M1–M4):** SlimClick-Mac.dmg öffnen und die App auf „Programme“ ziehen.
            **Älterer Mac mit Intel-Prozessor:** SlimClick-Mac-Intel.dmg
            **Ohne Installation (Windows):** SlimClick-Windows-portable.zip entpacken und SlimClick.exe starten.
            Anleitung mit Bildern: https://slimbitapps.github.io/SlimClick
          files: |
            out/SlimClick-Setup.exe
            out/SlimClick-Mac.dmg
            out/SlimClick-Mac-Intel.dmg
            out/SlimClick-Windows-portable.zip
